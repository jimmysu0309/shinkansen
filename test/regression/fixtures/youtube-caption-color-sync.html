<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube caption color sync fixture</title>
</head>
<body>
  <!-- 最小 player DOM:movie_player root(_getPlayerRoot)+ caption-window +
       帶自訂顏色 inline style 的 segment(模擬 YouTube 字幕樣式設定:字型顏色黃、
       背景綠 50% 透明——computed color / background-color 即使用者設定合成結果)。
       v2.0.85 overlay 顏色同步 路徑 A regression 用。 -->
  <div id="movie_player" class="html5-video-player">
    <div class="ytp-caption-window-container">
      <div class="caption-window">
        <span class="ytp-caption-segment" id="seg"
              style="color: rgb(255, 255, 0); background-color: rgba(0, 128, 0, 0.5);">Hello world</span>
      </div>
    </div>
    <video width="800" height="450"></video>
  </div>
</body>
</html>
