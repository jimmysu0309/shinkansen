<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>fixture: edit-link-boundary</title>
</head>
<body>
  <!--
    對應「編輯譯文模式:刪掉連結內的字後打字,新字掉到連結外」bug。

    結構通則(不綁站名):
      Chromium contenteditable 的刻意設計——游標落在 <a> 邊界(連結第一個字
      之前 / 最後一個字之後)時,打字一律插在連結「外面」。使用者「刪掉連結內
      的字、緊接著打替換字」語意上是替換連結文字,但補的字掉到連結外。

      修法(lib/edit-link-repair.js):beforeinput 刪除事件用 getTargetRanges()
      記下「動到內文的 <a>」;之後 insertText / compositionend 落地的插入段
      若貼在該 anchor 外的緊鄰邊界 → 搬回 anchor 內對應側、游標跟移。

    段落分工:
      #t1 start 邊界:刪連結第一個字 → 打字 → 應補回連結開頭
      #t2 end 邊界:刪連結最後一個字 → 打字 → 應補回連結尾端
      #t3 負向:沒刪字直接在連結邊界打字 → 維持 Chromium 原生行為(不進連結)
      #t4 IME 模擬:composition 提交路徑走 _repair test hook 直驗(Playwright
          無法產生真實 composition 事件)
  -->
  <article>
    <p id="t1">Please contact <a href="https://example.com/acme">Acme Corp</a> today</p>
    <p id="t2">Please contact <a href="https://example.com/acme">Acme Corp</a> today</p>
    <p id="t3">Please contact <a href="https://example.com/acme">Acme Corp</a> today</p>
    <p id="t4">Please contact <a href="https://example.com/acme">Acme Corp</a> today</p>
  </article>
</body>
</html>
