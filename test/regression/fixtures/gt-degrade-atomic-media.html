<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>gt degrade atomic media fixture</title></head>
<body>
  <!-- A4:8 個 <a> 觸發 degrade(>5 paired)+ inline emoji IMG。
       degrade 只該關 paired 標記，IMG atomic 必須照走(否則 emoji 從 source 流消失)。 -->
  <p id="degrade-emoji">socials:
    <a href="#1">YouTube</a> |
    <a href="#2">TikTok</a> |
    <a href="#3">Substack</a> |
    <a href="#4">Bluesky</a> |
    <a href="#5">LinkedIn</a> |
    <a href="#6">Threads</a> |
    <a href="#7">Pinterest</a> |
    <a href="#8">Mastodon</a>
    have a nice day <img id="emoji" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="😀"> bye</p>

  <!-- A5:3 個真實 paired anchor(≤5)+ media-like 自訂元素(無文字，tag 含 '-',
       內部 5 個空 B/I icon 殼)。鏡像計數若透明展開 media-like 內部，count 虛高
       (3+5=8 > 5)誤觸發 degrade → 連結全丟；正確行為：media-like 整顆 atomic
       不計，count=3 → 不 degrade,anchor 維持 paired 可翻。 -->
  <p id="media-nocount">Read <a href="#a">first link</a> then <a href="#b">second link</a> and
    <a href="#c">third link</a> share via
    <x-social-share><b></b><i></i><b></b><i></i><b></b></x-social-share> thanks.</p>
</body>
</html>
