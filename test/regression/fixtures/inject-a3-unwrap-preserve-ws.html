<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>a3 unwrap preserve ws fixture</title></head>
<body>
  <!-- 結構特徵(不綁站名):framework-managed 段落，帶 class 的 SPAN(preservable
       inline → strict 對齊視為 inline)包住 text，中夾一個 paired anchor。
       Google MT serializer 對 SPAN 透明展開 → tgt 端只剩 text,strict 對齊
       型別不符 fail → 落到 SPAN-unwrap 等長對齊。
       .text-tail 內文字帶 leading space + trailing \n(pre-wrap 視覺換行來源)。 -->
  <div id="tweet" style="white-space: pre-wrap"><span class="text-main">Hello brand new world</span><a class="ext-link" href="https://example.com">link text</a><span class="text-tail"> tail words here
</span></div>
</body>
</html>
