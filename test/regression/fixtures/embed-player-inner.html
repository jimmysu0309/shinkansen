<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>player</title></head>
<body>
<!-- 嵌入式影片播放器:media element + 少量介面文字(標題 / 頻道 / 訂閱數)。
     文字刻意用簡體:spec 走 convertOnly 本地簡繁轉換驗「有沒有被翻」,
     英文內容在該路徑不會被處理,會讓斷言變成假覆蓋(SANITY 破壞後照樣綠)。 -->
<div class="player">
  <video id="v" width="320" height="180" muted></video>
  <div class="title">安装这套开发工具</div>
  <div class="channel">示范频道</div>
  <div class="subs">120万位订阅者</div>
</div>
</body>
</html>
