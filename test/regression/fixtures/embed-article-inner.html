<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>article with video</title></head>
<body>
<!-- 對照組:iframe 內是「內含影片的文章」——有 media element 但文字量遠超門檻,照翻 -->
<article>
  <video id="v" width="320" height="180" muted></video>
  <p>这是一篇嵌在 iframe 里的完整文章，里面同时放了一支影片，但真正的主体是文字内容。段落偵测必须照常处理这种结构，不能因为页面里出现了 video 元素就整个跳过翻译，否则使用者会发现嵌入式的图文内容突然不翻了。</p>
  <p>为了让这个对照组稳定跨过字数门槛，这里再补一段说明文字。嵌入式播放器的判准是「有播放器而且几乎没有可读文字」，而这一篇显然属于内容而不是介面，所以它必须留在翻译范围之内。</p>
  <p>第三段继续补足字数，确保可见文字长度稳定超过四百字元的门槛，避免因为浏览器渲染差异造成断言飘移，让这条对照组能长期稳定地守住「内容型 iframe 不被误杀」这件事。</p>
</article>
</body>
</html>
