<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>media card direct text fixture</title></head>
<body>
<!-- 模擬「媒體卡片結構但 el 自己帶直屬文字」(v2.0.79 regression fixture)

  正向 case(#target-a):
    <li>直屬文字 + <img icon> + <div panel>(內含圖卡)</li>
    命中 mediaCardSkip 四條件:
      1. not H1-6
      2. el.querySelector('img, picture, video')(icon 與 panel 內圖卡都算)
      3. 直屬子有 CONTAINER_TAGS(DIV panel)
      4. directTextLength < 20(導覽標籤只有幾個字)
    Bug:整顆 LI FILTER_SKIP 後,walker 只會抓到 panel 內的段落,
        LI 直屬的 text node 沒有任何補抓路徑會撿走 → 該標籤永遠不翻。
    修法:FILTER_SKIP 之前補做 extractInlineFragments(el),把直屬 inline run
        抽成 fragment unit;卡片本體仍不當 unit(img / 子容器原地保留)。

  對照組(#target-b):
    典型附件卡片 LI:直屬無 text node(檔名在 SPAN 內)。
    extractInlineFragments 回空 → 行為與修法前完全相同(整條 skip,
    由內部葉節點補抓),確認修法沒放寬 mediaCardSkip 本身的守備範圍。

  文字刻意用簡體:繁中文字會被 flushRun 的 isAlreadyInTarget 過濾掉,
  fixture 若用繁中會驗不到 fragment 抽取本身。
-->

<!-- 正向:帶直屬文字的媒體卡片 -->
<ul id="target-a">
  <li class="nav-item" style="cursor: default">
    产品分类
    <img class="nav-arrow" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <div class="nav-panel">
      <div class="brand-card">
        <img class="brand-qr" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <div class="brand-name">数字潮牌</div>
        <div class="brand-desc">关注明日产品的数字潮牌</div>
      </div>
    </div>
  </li>
</ul>

<!-- 對照組:直屬無文字的附件卡片 -->
<ul id="target-b">
  <li class="attach-item">
    <a class="file-preview"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a>
    <div class="file-content">
      <span class="file-name">测试文件名称</span>
      <div class="file-meta">上传于昨天下午</div>
    </div>
  </li>
</ul>
</body>
</html>
